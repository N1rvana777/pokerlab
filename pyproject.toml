[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pokerlab"
version = "0.1.0"
description = "Local postflop solver research workbench with retained casino mathematics tools"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "tabulate>=0.9",
]

[project.optional-dependencies]
solver = ["psutil>=5.9", "scipy>=1.11"]
coach = ["scipy>=1.11", "claude-agent-sdk>=0.2.174"]
browser-test = ["playwright>=1.50"]
dev = [
    "pytest>=7.0",
    "jupyter>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pokerlab.solver" = ["web/*"]
"pokerlab.coach" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
